<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>(사)아름다운사람들 견적 자동생성기 및 엑셀 다운로드</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <!-- CSS -->
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app" class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <div class="brand-text">
          <h1>(사)아름다운사람들 견적 자동생성기</h1>
          <p>스마트한 인쇄 견적 계산 및 수정 가능한 Excel 파일 자동 다운로드</p>
        </div>
      </div>
      <div class="header-badge">
        <span class="pulse-dot"></span> 자동 계산 활성화
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="main-layout">
      <!-- Input Panel -->
      <section class="panel input-panel">
        <div class="panel-header">
          <h2><span class="icon">⚙️</span> 견적 조건 입력</h2>
        </div>

        <form id="quotation-form" onsubmit="return false;">
          <!-- 고객명 & 작성일자 -->
          <div class="form-row">
            <div class="form-group">
              <label for="customerName">고객명 <span class="required">*</span></label>
              <input type="text" id="customerName" placeholder="예: 한국학교" value="한국학교" required />
            </div>

            <div class="form-group">
              <label for="dateStr">작성일자 <span class="required">*</span></label>
              <input type="date" id="dateStr" required />
            </div>
          </div>

          <!-- 건명 / 제목 -->
          <div class="form-group">
            <label for="title">건명 / 제목 <span class="required">*</span></label>
            <input type="text" id="title" placeholder="예: 2026학년도 1학기 학교현황 분석자료" value="2026학년도 1학기 학교현황 분석자료" required />
          </div>

          <!-- 부수 & 페이지수 -->
          <div class="form-row">
            <div class="form-group">
              <label for="quantity">제작 부수 <span class="unit">(부)</span> <span class="required">*</span></label>
              <input type="number" id="quantity" min="1" step="1" value="100" required />
            </div>

            <div class="form-group">
              <label for="pages">내지 페이지 수 <span class="unit">(P)</span> <span class="required">*</span></label>
              <input type="number" id="pages" min="1" step="1" value="62" required />
            </div>
          </div>

          <!-- 종이 재질 종류 설정 (표지 & 내지) -->
          <div class="form-row">
            <div class="form-group">
              <label for="coverPaper">표지 종이 종류 <span class="unit">(H12)</span></label>
              <input type="text" id="coverPaper" placeholder="예: 아트250" value="아트250" />
            </div>

            <div class="form-group">
              <label for="innerPaper">내지 종이 종류 <span class="unit">(H13)</span></label>
              <input type="text" id="innerPaper" placeholder="예: 미색80" value="미색80" />
            </div>
          </div>

          <!-- 인쇄 방식 선택 -->
          <div class="form-group">
            <label>인쇄 방식 <span class="required">*</span></label>
            <div class="segmented-control segmented-control-3">
              <input type="radio" name="printType" id="type-kyung" value="경인쇄" />
              <label for="type-kyung" class="segment-label">
                <span class="radio-title">경인쇄</span>
                <span class="radio-desc">소량 / 마스터</span>
              </label>

              <input type="radio" name="printType" id="type-offset" value="옵셋" checked />
              <label for="type-offset" class="segment-label">
                <span class="radio-title">옵셋 인쇄</span>
                <span class="radio-desc">대량 / 고품질</span>
              </label>

              <input type="radio" name="printType" id="type-digital" value="디지털" />
              <label for="type-digital" class="segment-label">
                <span class="radio-title">디지털 인쇄</span>
                <span class="radio-desc">배너/현수막/명패</span>
              </label>
            </div>
          </div>

          <!-- 규격 크기 선택 -->
          <div class="form-group">
            <label>규격 크기 <span class="required">*</span></label>
            <div class="segmented-control">
              <input type="radio" name="printSize" id="size-10" value="10절" checked />
              <label for="size-10" class="segment-label center-align">
                <span class="radio-title">10절</span>
              </label>

              <input type="radio" name="printSize" id="size-16" value="16절" />
              <label for="size-16" class="segment-label center-align">
                <span class="radio-title">16절</span>
              </label>
            </div>
          </div>

          <!-- 경인쇄 전용: 표지 인쇄 도수 및 코팅 옵션 선택 (경인쇄 선택 시 표시) -->
          <div class="form-row" id="group-kyung-cover-options" style="display: none;">
            <div class="form-group">
              <label>표지 인쇄 도수 <span class="unit">(경인쇄 전용)</span></label>
              <div class="segmented-control">
                <input type="radio" name="kyungCoverType" id="kyung-cover-color" value="컬러표지" checked />
                <label for="kyung-cover-color" class="segment-label center-align">
                  <span class="radio-title">컬러표지</span>
                </label>
                <input type="radio" name="kyungCoverType" id="kyung-cover-bw" value="흑백표지" />
                <label for="kyung-cover-bw" class="segment-label center-align">
                  <span class="radio-title">흑백표지</span>
                </label>
              </div>
            </div>

            <div class="form-group">
              <label>표지 코팅 옵션 <span class="unit">(경인쇄 전용)</span></label>
              <div class="segmented-control">
                <input type="radio" name="kyungCoatingType" id="kyung-coating-matte" value="무광코팅" checked />
                <label for="kyung-coating-matte" class="segment-label center-align">
                  <span class="radio-title">무광코팅</span>
                </label>
                <input type="radio" name="kyungCoatingType" id="kyung-coating-none" value="코팅없음" />
                <label for="kyung-coating-none" class="segment-label center-align">
                  <span class="radio-title">코팅없음</span>
                </label>
              </div>
            </div>
          </div>

          <!-- 경인쇄 전용: 표지디자인 옵션 선택 (경인쇄 선택 시 표시) -->
          <div class="form-group" id="group-kyung-cover-design" style="display: none;">
            <label>표지디자인 옵션 선택 <span class="unit">(경인쇄 전용)</span></label>
            <div class="checkbox-group">
              <label class="checkbox-label">
                <input type="checkbox" id="opt-kyung-cover-design" />
                <span class="checkbox-text">표지디자인 <span class="unit">(300,000원)</span></span>
              </label>
            </div>
          </div>

          <!-- 경인쇄 전용: 이미지컷작업 옵션 선택 (경인쇄 선택 시 표시) -->
          <div class="form-group" id="group-kyung-image-cut" style="display: none;">
            <label>이미지컷작업 옵션 선택 <span class="unit">(경인쇄 전용)</span></label>
            <div class="checkbox-group" style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
              <label class="checkbox-label">
                <input type="checkbox" id="opt-kyung-image-cut" />
                <span class="checkbox-text">이미지컷작업</span>
              </label>
              <div id="container-kyung-image-cut-qty" style="display: none; align-items: center; gap: 6px;">
                <label for="kyungImageCutQty" style="font-size: 13px; margin: 0;">수량:</label>
                <input type="number" id="kyungImageCutQty" min="1" step="1" value="1" style="width: 80px; padding: 6px 10px;" />
                <span style="font-size: 13px;">컷</span>
              </div>
            </div>
          </div>

          <!-- 경인쇄 전용: 조판생략 감액 옵션 (경인쇄 선택 시 표시) -->
          <div class="form-group" id="group-kyung-discount" style="display: none;">
            <label for="kyungDiscount">조판생략 감액 선택</label>
            <select id="kyungDiscount" class="form-select">
              <option value="3500" selected>조판생략감액3 (3,500원)</option>
              <option value="5150">조판생략감액2 (5,150원)</option>
              <option value="6780">조판생략감액1 (6,780원)</option>
              <option value="0">감액 없음 (0원)</option>
              <option value="custom">직접 입력</option>
            </select>
          </div>

          <!-- 디지털 인쇄 전용: 컬러 면수/흑백 면수 및 추가 옵션 선택 (디지털 선택 시 표시) -->
          <div class="form-group" id="group-digital-options" style="display: none;">
            <div class="form-row" style="margin-bottom: 12px;">
              <div class="form-group">
                <label for="digitalColorPages">컬러 면수 <span class="unit">(P)</span></label>
                <input type="number" id="digitalColorPages" min="0" step="1" value="62" placeholder="예: 62" />
              </div>
              <div class="form-group">
                <label for="digitalBWPages">흑백 면수 <span class="unit">(P)</span></label>
                <input type="number" id="digitalBWPages" min="0" step="1" value="0" placeholder="예: 0" />
              </div>
            </div>

            <label style="margin-top: 4px;">디지털 추가 옵션 선택</label>

            <div class="checkbox-group">
              <label class="checkbox-label">
                <input type="checkbox" id="opt-digital-cover-type" />
                <span class="checkbox-text">책자-표지조판 <span class="unit">(300,000원)</span></span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="opt-digital-inner-edit" />
                <span class="checkbox-text">책자-내지편집 <span class="unit">(P당 10,040원)</span></span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="opt-digital-xbanner" />
                <span class="checkbox-text">X배너</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="opt-digital-banner" />
                <span class="checkbox-text">현수막</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="opt-digital-nameplate" />
                <span class="checkbox-text">명패</span>
              </label>
            </div>

            <!-- X배너 상세 입력 -->
            <div class="form-group" id="group-digital-xbanner-details" style="display: none; margin-top: 10px;">
              <div class="form-row">
                <div class="form-group">
                  <label for="digitalXBannerSize">X배너 크기 <span class="unit">(E19)</span></label>
                  <input type="text" id="digitalXBannerSize" value="600x1800mm" placeholder="예: 600x1800mm" />
                </div>
                <div class="form-group">
                  <label for="digitalXBannerQty">X배너 수량 <span class="unit">(G19)</span></label>
                  <input type="number" id="digitalXBannerQty" min="1" step="1" value="1" />
                </div>
              </div>
              <div class="form-group" style="margin-top: 4px;">
                <label>거치대 포함 여부 <span class="unit">(K21)</span></label>
                <div class="segmented-control">
                  <input type="radio" name="digitalXBannerStand" id="xbanner-stand-yes" value="거치대포함" checked />
                  <label for="xbanner-stand-yes" class="segment-label center-align">
                    <span class="radio-title">거치대포함</span>
                    <span class="radio-desc">(기본 60,000원)</span>
                  </label>

                  <input type="radio" name="digitalXBannerStand" id="xbanner-stand-no" value="거치대미포함" />
                  <label for="xbanner-stand-no" class="segment-label center-align">
                    <span class="radio-title">거치대미포함</span>
                    <span class="radio-desc">(기본 40,000원)</span>
                  </label>
                </div>
              </div>
            </div>

            <!-- 현수막 상세 입력 -->
            <div class="form-row" id="group-digital-banner-details" style="display: none; margin-top: 10px;">
              <div class="form-group">
                <label for="digitalBannerSize">현수막 크기 <span class="unit">(E22)</span></label>
                <input type="text" id="digitalBannerSize" value="4000x900mm" placeholder="예: 4000x900mm" />
              </div>
              <div class="form-group">
                <label for="digitalBannerQty">현수막 수량 <span class="unit">(G22)</span></label>
                <input type="number" id="digitalBannerQty" min="1" step="1" value="1" />
              </div>
            </div>

            <!-- 명패 상세 입력 -->
            <div class="form-group" id="group-digital-nameplate-details" style="display: none; margin-top: 10px;">
              <label for="digitalNameplateQty">명패 수량 <span class="unit">(G25)</span></label>
              <input type="number" id="digitalNameplateQty" min="1" step="1" value="1" />
            </div>
          </div>

          <!-- 커스텀 감액 금액 입력 (직접 입력 선택 시 노출) -->
          <div class="form-group" id="group-kyung-custom-discount" style="display: none;">
            <label for="kyungCustomDiscount">직접 입력 감액 금액 <span class="unit">(원)</span></label>
            <input type="number" id="kyungCustomDiscount" min="0" step="100" value="3500" placeholder="예: 3500" />
          </div>

          <!-- 옵셋 인쇄 전용: 표지 인쇄도수 선택 (옵셋 선택 시 표시) -->
          <div class="form-group" id="group-offset-cover-type">
            <label for="offsetCoverType">표지 인쇄 도수 선택 <span class="unit">(옵셋 전용)</span></label>
            <select id="offsetCoverType" class="form-select">
              <option value="표지단면4도" selected>표지단면4도</option>
              <option value="표지양면4도">표지양면4도</option>
              <option value="표지양면4/1도">표지양면4/1도</option>
            </select>
          </div>

          <!-- 옵셋 인쇄 전용: 후가공 옵션 선택 (옵셋 선택 시 표시) -->
          <div class="form-group" id="group-offset-postprocessing">
            <label>후가공 옵션 선택 <span class="unit">(옵셋 전용)</span></label>
            <div class="checkbox-group">
              <label class="checkbox-label">
                <input type="checkbox" id="opt-epoxy" />
                <span class="checkbox-text">에폭시 <span class="unit">(1식 40만원)</span></span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="opt-foil" />
                <span class="checkbox-text">박인쇄 <span class="unit">(1식 40만원)</span></span>
              </label>
            </div>
          </div>

          <!-- 옵셋 인쇄 전용: 일반관리비 및 이윤 입력 (옵셋 선택 시 표시) -->
          <div class="form-row" id="group-offset-rates">
            <div class="form-group">
              <label for="overheadRate">일반관리비 <span class="unit">(%)</span> <span class="required">*</span></label>
              <input type="number" id="overheadRate" min="0" max="100" step="1" value="10" placeholder="예: 10" required />
            </div>

            <div class="form-group">
              <label for="profitRate">이윤 <span class="unit">(%)</span> <span class="required">*</span></label>
              <input type="number" id="profitRate" min="0" max="100" step="1" value="20" placeholder="예: 20" required />
            </div>
          </div>

          <!-- 할인율 입력 -->
          <div class="form-group" id="group-discount-rate">
            <label for="discountRate">할인율 <span class="unit">(%)</span> <span class="required">*</span></label>
            <input type="number" id="discountRate" min="1" max="100" step="1" value="85" placeholder="예: 85" required />
          </div>

          <!-- Action Button -->
          <div class="action-box">
            <button type="button" id="btn-download-excel" class="btn btn-primary">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              수정 가능한 Excel 파일 다운로드 (.xlsx)
            </button>
          </div>
        </form>
      </section>

      <!-- Preview Panel -->
      <section class="panel preview-panel">
        <div class="panel-header">
          <h2><span class="icon">📊</span> 견적 실시간 프리뷰</h2>
          <span class="badge" id="preview-type-badge">옵셋 10절</span>
        </div>

        <div class="summary-cards">
          <div class="card card-accent">
            <span class="card-label">최종 합계 금액 (VAT 포함)</span>
            <span class="card-value" id="summary-grand-total">0 원</span>
          </div>
          <div class="card">
            <span class="card-label">공급가액</span>
            <span class="card-value" id="summary-supply-price">0 원</span>
          </div>
          <div class="card">
            <span class="card-label">부가가치세 (10%)</span>
            <span class="card-value" id="summary-vat">0 원</span>
          </div>
        </div>

        <!-- Table View -->
        <div class="table-container">
          <table class="preview-table">
            <thead>
              <tr>
                <th>항목 / 세부내역</th>
                <th class="text-right">수량 / 규격</th>
                <th class="text-right">단가 (원) <span class="unit" style="font-weight: normal; color: var(--accent-light);">(수정 가능)</span></th>
                <th class="text-right">금액 (원)</th>
              </tr>
            </thead>
            <tbody id="preview-table-body">
              <!-- Dynamically Populated -->
            </tbody>
          </table>
        </div>

        <!-- Detailed Calculation Breakdown -->
        <div class="breakdown-container" id="breakdown-container">
          <!-- Dynamically Populated -->
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>© 2026 (사)아름다운사람들 견적 자동생성 시스템. 엑셀 원본 템플릿의 서식 및 공식(Formula)이 보존됩니다.</p>
    </footer>
  </div>

  <!-- Entry Script -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
